# Legacy website jails are opt-in; ordinary HTTP errors are not attack proof.
# Enable only after checking the filter against the site's real traffic.
# Use the shared WAF's explicit attack/rate events for its managed integration.
# These defaults do not change existing installed jails or replace ban actions.
[fail2ban-nginx-cc]

enabled = false
filter = fail2ban-nginx-cc
chain = DOCKER-USER
port = http,https
action = cloudflare-docker
logpath  = %(nginx_access_log)s
maxretry = 5
bantime = 3600
findtime = 3600
ignoreip = 172.18.0.0/16 127.0.0.1/8 ::1

