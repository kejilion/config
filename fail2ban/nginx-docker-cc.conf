# Legacy website jails are opt-in; ordinary HTTP errors are not attack proof.
# Enable only after checking the filter against the site's real traffic.
# Use the shared WAF's explicit attack/rate events for its managed integration.
# These defaults do not change existing installed jails or replace ban actions.
[DEFAULT]
maxretry = 10
bantime = 3600
findtime = 300
# ignoreip = 172.0.0.0/8

bantime.increment = true
bantime.factor = 1
bantime.maxtime = 2592000  # 30 天
bantime.multipliers = 1 4 16 64



[fail2ban-nginx-cc]
enabled = false
filter = fail2ban-nginx-cc
port = http,https
action = cloudflare-docker
logpath = /home/web/log/nginx/access.log


[nginx-418]
enabled = false
filter   = nginx-418
port     = http,https
action = cloudflare-docker
logpath = /home/web/log/nginx/access.log


[nginx-bad-request]
enabled = false
# chain = DOCKER-USER
filter   = nginx-bad-request
port    = http,https
action = cloudflare-docker
logpath = /home/web/log/nginx/access.log


[nginx-badbots]
enabled = false
# chain = DOCKER-USER
filter   = apache-badbots
port     = http,https
action = cloudflare-docker
logpath = /home/web/log/nginx/access.log


[nginx-botsearch]
enabled = false
# chain = DOCKER-USER
filter   = nginx-botsearch
port    = http,https
action = cloudflare-docker
logpath  = /home/web/log/nginx/error.log


[nginx-deny]
enabled = false
# chain = DOCKER-USER
filter   = nginx-deny
port     = http,https
action = cloudflare-docker
logpath  = /home/web/log/nginx/error.log


[nginx-http-auth]
enabled = false
# chain = DOCKER-USER
filter   = nginx-http-auth
port    = http,https
action = cloudflare-docker
logpath  = /home/web/log/nginx/error.log

[nginx-unauthorized]
enabled = false
# chain = DOCKER-USER
filter   = nginx-unauthorized
port     = http,https
action = cloudflare-docker
logpath = /home/web/log/nginx/access.log


[php-url-fopen]
enabled = false
# chain = DOCKER-USER
filter   = php-url-fopen
port    = http,https
action = cloudflare-docker
logpath = /home/web/log/nginx/access.log

